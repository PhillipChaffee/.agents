# Link-check configuration. Retry then fail: a timeout must not pass
# silently. Add exclusions here with a reason: exclude_path skips kcov's
# generated coverage/ HTML report tree, whose relative asset links resolve
# only inside the report directory itself, and the shell coverage gate
# keeps the reports after the run. The OWNER/REPO coveralls placeholders
# resolve in CI contexts that lychee accepts.
max_retries = 2
timeout = 20
accept = ["200..=204", "429", "502..=504"]
# Remap GitHub tree/blob subpaths to repo roots so lychee validates them via
# api.github.com (with GITHUB_TOKEN) instead of scraping github.com HTML over HTTP/2.
remap = ["^https://github\\.com/([^/]+/[^/]+)/(?:tree|blob)/.* https://github.com/$1"]
# Pre-rename canonical URLs resolve once PhillipChaffee/.agents is renamed to PhillipChaffee/magic on GitHub.
exclude = ["^https://github\\.com/PhillipChaffee/magic"]
# Upstream skill documents contain plugin-local and illustrative links.
exclude_path = ["./coverage", "./skills/writing-skills", "./skills/writing-plans", "./skills/subagent-driven-development", "./skills-disabled"]
