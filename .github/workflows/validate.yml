name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/validate.sh
      - name: Install smoke test (sandboxed)
        run: |
          SBX=$(mktemp -d)
          HOME="$SBX" ./scripts/install.sh --dry-run --target agents >/dev/null
          HOME="$SBX" ./scripts/install.sh --target agents >/dev/null
          test -f "$SBX/.agents/skills/code-review/skill.md"
          test -f "$SBX/.agents/skills/research/skill.md"
          test -f "$SBX/.agents/agents/cr-security/agent.md"
          test -f "$SBX/.agents/rules/look-it-up.md"
          test ! -f "$SBX/.agents/agents.md"
          rm -rf "$SBX"