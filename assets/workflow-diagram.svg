<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 230" width="100%" role="img" aria-label="magic workflow: 1. Session Start -> 2. Route Task -> 3. Research & 4. Architect & Plan -> 5. Execute & Prove -> 6. Review & Clean -> 7. Ship">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12; }
      .node-box { fill: #161b22; stroke: #3b434b; stroke-width: 1.5; }
      .node-pill { fill: #161b22; stroke: #d2a8ff; stroke-width: 1.75; }
      .node-ship { fill: #161b22; stroke: #3fb950; stroke-width: 1.75; }
      .node-diamond { fill: #161b22; stroke: #e3b341; stroke-width: 1.75; }
      .edge { fill: none; stroke: #8b949e; stroke-width: 1.75; }
      .edge-head { fill: #8b949e; }
      .badge-bg { fill: #21262d; stroke: #30363d; stroke-width: 1; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #f0f6fc; text-anchor: middle; }
      .sub { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #8b949e; text-anchor: middle; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #c9d1d9; text-anchor: middle; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #f6f8fa; stroke: #d0d7de; }
        .node-box { fill: #ffffff; stroke: #d0d7de; }
        .node-pill { fill: #ffffff; stroke: #8250df; }
        .node-ship { fill: #ffffff; stroke: #1a7f37; }
        .node-diamond { fill: #ffffff; stroke: #9a6700; }
        .edge { stroke: #57606a; }
        .edge-head { fill: #57606a; }
        .badge-bg { fill: #eaeef2; stroke: #d0d7de; }
        .title { fill: #1f2328; }
        .sub { fill: #57606a; }
        .edge-label { fill: #1f2328; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" class="edge-head" />
    </marker>
  </defs>

  <rect x="4" y="4" width="1172" height="222" rx="12" class="bg" />

  <!-- 1. Session Start -->
  <rect x="24" y="83" width="150" height="64" rx="32" class="node-pill" />
  <text x="99" y="110" class="title">1. Session Start</text>
  <text x="99" y="129" class="sub">/using-poteto</text>

  <!-- Edge 1 -> 2 -->
  <path d="M 174 115 L 204 115" class="edge" marker-end="url(#arrow)" />

  <!-- 2. Route Task (Diamond) -->
  <polygon points="274,55 340,115 274,175 208,115" class="node-diamond" />
  <text x="274" y="119" class="title">2. Route Task</text>

  <!-- Edge 2 -> 3 (Explore) -->
  <path d="M 318 89 L 348 58 L 444 58" class="edge" marker-end="url(#arrow)" />
  <rect x="358" y="46" width="66" height="22" rx="4" class="badge-bg" />
  <text x="391" y="61" class="edge-label">Explore</text>

  <!-- Edge 2 -> 4 (Design & Plan) -->
  <path d="M 318 141 L 348 172 L 444 172" class="edge" marker-end="url(#arrow)" />
  <rect x="345" y="160" width="92" height="22" rx="4" class="badge-bg" />
  <text x="391" y="175" class="edge-label">Design &amp; Plan</text>

  <!-- 3. Research -->
  <rect x="448" y="22" width="186" height="72" rx="8" class="node-box" />
  <text x="541" y="49" class="title">3. Research</text>
  <text x="541" y="69" class="sub">/research · /how · /why</text>

  <!-- 4. Architect & Plan -->
  <rect x="448" y="136" width="186" height="72" rx="8" class="node-box" />
  <text x="541" y="163" class="title">4. Architect &amp; Plan</text>
  <text x="541" y="183" class="sub">/architect · /writing-plans</text>

  <!-- Edges 3 & 4 -> 5 -->
  <path d="M 634 58 L 656 58 L 656 100 L 676 100" class="edge" marker-end="url(#arrow)" />
  <path d="M 634 172 L 656 172 L 656 130 L 676 130" class="edge" marker-end="url(#arrow)" />

  <!-- 5. Execute & Prove -->
  <rect x="680" y="67" width="166" height="96" rx="8" class="node-box" />
  <text x="763" y="96" class="title">5. Execute &amp; Prove</text>
  <text x="763" y="118" class="sub">/poteto-mode · /sdd</text>
  <text x="763" y="137" class="sub">/tdd · /proof</text>

  <!-- Edge 5 -> 6 -->
  <path d="M 846 115 L 874 115" class="edge" marker-end="url(#arrow)" />

  <!-- 6. Review & Clean -->
  <rect x="878" y="67" width="136" height="96" rx="8" class="node-box" />
  <text x="946" y="96" class="title">6. Review &amp; Clean</text>
  <text x="946" y="118" class="sub">/interrogate</text>
  <text x="946" y="137" class="sub">/no-comments</text>

  <!-- Edge 6 -> 7 -->
  <path d="M 1014 115 L 1042 115" class="edge" marker-end="url(#arrow)" />

  <!-- 7. Ship -->
  <rect x="1046" y="75" width="110" height="80" rx="40" class="node-ship" />
  <text x="1101" y="102" class="title">7. Ship</text>
  <text x="1101" y="121" class="sub">/autopilot</text>
  <text x="1101" y="138" class="sub">/shipping</text>
</svg>
